[package]
name = "core-math"
version = "1.3.0-dev"
authors = ["Chen-Pang He (https://jdh8.org)"]
edition = "2024"
rust-version = "1.85"
description = "Rusty API for CORE-MATH"
repository = "https://github.com/jdh8/core-math"
license = "MIT"
categories = ["mathematics", "no-std"]
keywords = ["floating-point", "trigonometry", "exponential", "logarithm", "special-functions"]

[features]
f16 = ["core-math-sys/f16"]
f128 = ["core-math-sys/f128"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
core-math-sys = "1.3.0"

[dev-dependencies]
criterion = "0.8"
libm = "0.2"
rand = "0.10"

[profile.dev]
debug = "line-tables-only"
opt-level = 3

[[bench]]
name = "all"
harness = false
